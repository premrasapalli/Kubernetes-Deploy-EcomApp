# ── తెలుగు వివరణ ─────────────────────────────────────────────
# ClusterSecretStore: ESO ఏ AWS Secrets Manager నుండి, ఏ identity తో చదవాలో చెబుతుంది.
# auth.jwt.serviceAccountRef → platform/external-secrets SA (IRSA role annotation).
# ─────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: platform
