# ── తెలుగు వివరణ ─────────────────────────────────────────────
# Cilium LB IPAM pool: Gateway కి ఇవ్వగల IPలు. 10.0.11.250 private subnet లో ఉంది.
# L2AnnouncementPolicy: ఆ VIP ను node NIC ద్వారా ARP/NDP ప్రకటిస్తుంది.
# ఇది AWS Load Balancer ఖర్చు లేకుండా ల్యాబ్‌లో పనిచేస్తుంది.
# ─────────────────────────────────────────────────────────────
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: retailx-pool
spec:
  blocks:
    - cidr: 10.0.11.250/32
  disabled: false
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: default
spec:
  interfaces:
    - ^eth[0-9]+
    - ^ens[0-9]+
  externalIPs: true
  loadBalancerIPs: true
