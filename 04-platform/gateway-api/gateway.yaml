# ── తెలుగు వివరణ ─────────────────────────────────────────────
# Gateway = లోడ్ బ్యాలెన్సర్ + listeners. LB IPAM ద్వారా VIP 10.0.11.250.
# allowedRoutes.namespaces.from=Same → అదే namespace లోని HTTPRouteలు మాత్రమే.
# ─────────────────────────────────────────────────────────────
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: retailx-gateway
  namespace: retailx
  annotations:
    io.cilium/lb-ipam-ips: "10.0.11.250"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
