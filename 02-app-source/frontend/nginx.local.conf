# ── తెలుగు వివరణ ─────────────────────────────────────────────
# Local docker-compose కోసం మాత్రమే. EKS లో Gateway API HTTPRoute ఈ పని చేస్తుంది;
# ఇక్కడ nginx నే reverse proxy గా /api/* ని సేవా DNS పేర్లకు పంపుతుంది.
# unprivileged nginx కాబట్టి port 8080 (80 కాదు).
# ─────────────────────────────────────────────────────────────
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/products {
    proxy_pass http://product-api:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/cart {
    proxy_pass http://cart-api:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/orders {
    proxy_pass http://order-api:8083;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
