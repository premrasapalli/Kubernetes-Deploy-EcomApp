# ── తెలుగు వివరణ ─────────────────────────────────────────────
# Phase 1 local smoke test: EKS ఖర్చు లేకుండా 4 సేవలు + Postgres + Redis ని
# ఒకే machine పై నడిపి app logic ని verify చేయడం. Cloud లో ఇదే సేవలు
# 03-k8s-manifests/ ద్వారా నడుస్తాయి; ఇక్కడ పేర్లు అక్కడి Service పేర్లతో సమానం.
# వాడు: docker compose -f 02-app-source/docker-compose.yml up -d --build
# ─────────────────────────────────────────────────────────────
name: retailx-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retailx
      POSTGRES_PASSWORD: retailx-local
      POSTGRES_DB: retailx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailx -d retailx"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  product-api:
    build: ./product-api
    environment:
      PORT: "8081"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: retailx
      DB_USER: retailx
      DB_PASSWORD: retailx-local
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  cart-api:
    build: ./cart-api
    environment:
      PORT: "8082"
      REDIS_URL: redis://redis:6379
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  order-api:
    build: ./order-api
    environment:
      PORT: "8083"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: retailx
      DB_USER: retailx
      DB_PASSWORD: retailx-local
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  frontend:
    build: ./frontend
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      product-api:
        condition: service_healthy
      cart-api:
        condition: service_healthy
      order-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
