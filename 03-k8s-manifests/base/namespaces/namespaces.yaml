# ── తెలుగు వివరణ ─────────────────────────────────────────────
# Namespaceలు + Pod Security Standards. retailx = restricted (అత్యంత కఠినం):
# root కాదు, privilege escalation కాదు, capabilities drop ALL, seccomp RuntimeDefault.
# platform = baseline (ESO controllers కి కొంత స్వేచ్ఛ కావాలి).
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: retailx
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
