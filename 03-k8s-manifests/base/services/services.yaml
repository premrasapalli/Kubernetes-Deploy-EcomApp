# ── తెలుగు వివరణ ─────────────────────────────────────────────
# ClusterIP services: స్థిరమైన DNS + load balancing. postgres/redis headless
# (clusterIP: None) → StatefulSet stable identity కోసం.
# port = service port; targetPort = container port (రెండూ వేరుగా ఉండొచ్చు).
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: retailx
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: product-api
  namespace: retailx
spec:
  selector:
    app: product-api
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: cart-api
  namespace: retailx
spec:
  selector:
    app: cart-api
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: retailx
spec:
  selector:
    app: order-api
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: retailx
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: retailx
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
