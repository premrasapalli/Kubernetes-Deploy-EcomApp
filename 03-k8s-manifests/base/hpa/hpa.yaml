# ── తెలుగు వివరణ ─────────────────────────────────────────────
# HPA v2: CPU 70% దాటితే పాడ్‌లు పెంచుతుంది. metrics-server అవసరం.
# minReplicas = HPA నిర్వహించే కనీసం; Deployment replicas ను HPA మారుస్తుంది.
# ─────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: retailx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
