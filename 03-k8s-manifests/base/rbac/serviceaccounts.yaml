# ── తెలుగు వివరణ ─────────────────────────────────────────────
# ప్రతి workload కి ప్రత్యేక ServiceAccount. App పాడ్‌లు K8s API వాడవు కాబట్టి
# automountServiceAccountToken: false → token కూడా mount అవ్వదు (least privilege).
# nettest మాత్రమే API వాడుతుంది (debug role కోసం) → token true.
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: retailx
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-api
  namespace: retailx
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cart-api
  namespace: retailx
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-api
  namespace: retailx
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: retailx
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: retailx
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nettest
  namespace: retailx
