# ── తెలుగు వివరణ ─────────────────────────────────────────────
# ExternalSecret = AWS Secrets Manager నుండి K8s Secret కి sync.
# Git లో సీక్రెట్ లేదు; ESO IRSA ద్వారా AWS నుండి తెస్తుంది.
# target.name → workloads ఏ Secret పేరు reference చేస్తాయో అదే.
# ─────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: retailx
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: retailx/postgres
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-secret
  namespace: retailx
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: jwt-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: retailx/jwt
