apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: ecommerce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-role
  namespace: ecommerce
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-rolebinding
  namespace: ecommerce
subjects:
  - kind: ServiceAccount
    name: frontend-sa
    namespace: ecommerce
roleRef:
  kind: Role
  name: frontend-role
  apiGroup: rbac.authorization.k8s.io
